<script>/* HELICO RESTO — Application PWA. Données vérifiées + synchronisation GitHub. */
(()=>{'use strict';
const $=s=>document.querySelector(s),view=$('#view');
const store={get(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{notify('Stockage local indisponible')}}};
const state={venues:[],favorites:store.get('hr-favs-v2',[]),overrides:store.get('hr-overrides-v2',{}),hidden:store.get('hr-hidden-v2',[]),tab:'home',detailTab:'discovery',query:'',category:'',region:'',order:'name',near:null,map:null,markers:[],currentId:null,limit:36,heroIndex:0};
const svg=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const safeLink=u=>{try{let x=new URL(u,location.href);return ['https:','http:','tel:','mailto:'].includes(x.protocol)?x.href:''}catch{return''}};
const img=v=>v.image&&/^https?:\/\//.test(v.image)||v.image?.startsWith('assets/')?v.image:'';
const filename=(v)=>v.image?.includes('assets/')?'Photographie de la fiche':v.imageOrigin?'Photographie référencée':'Photo en cours de récupération';
const fmt=v=>v===null||v===undefined||v===''?'Non renseigné':v;
const dist=(a,b,c,d)=>{let rad=x=>x*Math.PI/180,R=6371,t=2*Math.asin(Math.sqrt(Math.sin(rad(c-a)/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(rad(d-b)/2)**2));return R*t};
const place=v=>`${v.city||'France'}${v.department?` (${v.department})`:''}`;
const iconFallback=`<div class="image-missing"><span>✧</span>Photo à ajouter</div>`;
function media(v,cls='',eager=false){let p=img(v);return p?`<img class="${cls}" src="${esc(p)}" loading="${eager?'eager':'lazy'}" alt="${esc(v.name)}" referrerpolicy="no-referrer"/>${iconFallback.replace('image-missing','image-missing hide')}`:iconFallback;}
let toastTimer;function notify(s){let el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2700)}
function save(){store.set('hr-favs-v2',state.favorites);store.set('hr-overrides-v2',state.overrides);store.set('hr-hidden-v2',state.hidden)}
function compiled(base){let all=new Map((base||[]).filter(x=>x.id&&x.name).map(x=>[x.id,x]));Object.entries(state.overrides).forEach(([k,v])=>all.set(k,{...all.get(k),...v}));return [...all.values()].filter(v=>!state.hidden.includes(v.id))}
function filtered(){let a=state.venues.filter(v=>!state.category||v.categories?.includes(state.category)).filter(v=>!state.region||v.region===state.region).filter(v=>!state.query||norm([v.name,v.city,v.department,v.region,v.description,v.address,v.categories?.join(' ')].join(' ')).includes(norm(state.query)));if(state.order==='name')a.sort((x,y)=>x.name.localeCompare(y.name,'fr'));if(state.order==='region')a.sort((x,y)=>x.region.localeCompare(y.region)||x.name.localeCompare(y.name));if(state.order==='distance'&&state.near)a.sort((x,y)=>distance(x)-distance(y));return a}
function distance(v){return state.near&&Number.isFinite(v.lat)&&Number.isFinite(v.lon)?dist(state.near[0],state.near[1],v.lat,v.lon):Number.POSITIVE_INFINITY}
function card(v){let fav=state.favorites.includes(v.id),d=distance(v);return `<article class="venue-card"><button class="card-cover" data-open="${esc(v.id)}" aria-label="Ouvrir ${esc(v.name)}">${media(v)}</button><button class="favorite-action ${fav?'saved':''}" data-favorite="${esc(v.id)}" aria-label="${fav?'Retirer des favoris':'Ajouter aux favoris'}" style="top:10px;right:10px">${svg('heart')}</button><div class="card-content" data-open="${esc(v.id)}"><div class="venue-kind">${esc((v.categories||[]).slice(0,2).join(' · '))}</div><div class="venue-name">${esc(v.name)}</div><div class="venue-place">${svg('pin')}<span>${esc(place(v))}${Number.isFinite(d)?' · '+Math.round(d)+' km':''}</span></div><div class="card-more">Découvrir ${svg('arrow')}</div></div></article>`}

function handleClick(e){let t=e.target.closest('[data-tab],[data-open],[data-favorite],[data-pane],[data-back],[data-copy],[data-share],[data-reset],[data-category],[data-near],[data-loadmore],[data-clear-search],[data-action],[data-delete]');if(!t)return;
if(t.dataset.favorite){e.preventDefault();e.stopPropagation();let id=t.dataset.favorite;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();notify(state.favorites.includes(id)?'Ajouté aux favoris':'Retiré des favoris');if(state.tab==='detail')details(state.currentId,state.detailTab);else if(state.tab==='favorites')favorites();else if(state.tab==='explore')renderResults();else if(state.tab==='home')home();return}
if(t.dataset.open){navigate('detail',t.dataset.open);return}if(t.dataset.tab){navigate(t.dataset.tab);return}if(t.hasAttribute('data-back')){navigate('explore');return}if(t.dataset.pane){details(state.currentId,t.dataset.pane);return}if(t.hasAttribute('data-copy')){copy(t.dataset.copy);return}if(t.dataset.share){share(t.dataset.share);return}if(t.hasAttribute('data-reset')){resetFilters();return}if(t.dataset.category){state.category=t.dataset.category;state.limit=36;navigate('explore');return}if(t.hasAttribute('data-near')){near();return}if(t.hasAttribute('data-loadmore')){state.limit+=36;renderResults();return}if(t.hasAttribute('data-clearSearch')){state.query='';if($('#venueSearch')){$('#venueSearch').value='';renderResults()}return}if(t.dataset.action==='export'){downloadJSON();return}if(t.dataset.action==='import'){let file=document.createElement('input');file.type='file';file.accept='application/json,.json';file.addEventListener('change',()=>loadImport(file.files[0]));file.click();return}if(t.dataset.delete){if(!confirm('Masquer localement cette fiche ?'))return;state.hidden.push(t.dataset.delete);state.venues=compiled(window.HELICO_SYNC_BASE||[]);save();notify('Fiche masquée localement');navigate('editor');return}}
view.addEventListener('input',e=>{if(e.target.id==='heroQuery'){let q=e.target.value.trim().toLocaleLowerCase('fr');let box=$('#heroSuggestions');if(box){let matches=q.length>=2?state.venues.filter(v=>[v.name,v.city,v.department,v.region,v.description,...(v.categories||[])].join(' ').toLocaleLowerCase('fr').includes(q)).slice(0,5):[];box.innerHTML=matches.map(v=>`<button type="button" data-open="${esc(v.id)}"><b>${esc(v.name)}</b><small>${esc(place(v))}</small></button>`).join('')}}if(e.target.id==='venueSearch'){state.query=e.target.value;state.limit=36;renderResults()}});
view.addEventListener('change',e=>{if(e.target.id==='filterRegion'){state.region=e.target.value;state.limit=36;renderResults()}if(e.target.id==='filterCat'){state.category=e.target.value;state.limit=36;renderResults()}if(e.target.id==='filterSort'){state.order=e.target.value;if(state.order==='distance'&&!state.near){near();return}renderResults()}if(e.target.id==='entrySelect')editor(e.target.value||null)});
view.addEventListener('submit',e=>{if(e.target.id==='heroSearchForm'){e.preventDefault();state.query=$('#heroQuery')?.value.trim()||'';state.limit=36;navigate('explore');return}if(e.target.id==='editForm'){e.preventDefault();doSubmit(e.target)}});
window.addEventListener('click',handleClick);
window.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement&&e.target.closest('#view')){e.target.style.display='none';let fallback=e.target.nextElementSibling;if(fallback?.classList.contains('image-missing'))fallback.classList.remove('hide')}},true);
window.addEventListener('popstate',fromHash);
async function boot(){
  // Afficher les données embarquées immédiatement : aucune dépendance au réseau.
  const fallback=Array.isArray(window.HELICO_VENUES)?window.HELICO_VENUES:[];
  window.HELICO_SYNC_BASE=fallback;
  state.venues=compiled(fallback);
  if(!state.venues.length && fallback.length){state.hidden=[];state.overrides={};state.venues=compiled(fallback);save()}
  try{fromHash()}catch(err){console.error('Affichage initial',err);navigate('explore',null,'discovery',false)}

}

boot();
})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))).catch(()=>{});}</script></body></html>
